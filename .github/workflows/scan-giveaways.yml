name: Scan giveaways

on:
  schedule:
    - cron: "7 * * * *"        # every hour at minute 7 (UTC). Edit to change the schedule.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't write files)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: scan-giveaways
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        run: python scripts/scan.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "giveaway-bot"
          git config user.email "giveaway-bot@users.noreply.github.com"
          git add data feed.xml
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "chore: scan $(date -u +%FT%TZ)" && git pull --rebase && git push; fi
