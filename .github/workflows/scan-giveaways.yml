name: Scan giveaways

# GitHub's scheduled runs are best effort: they can start late or be skipped when GitHub is busy.
# To get close to hourly, there are two schedules an hour apart-ish (minute 17 and minute 47).
# The "gate" step skips a scheduled run if the last scan was under 30 minutes ago, so you never get double scans.
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  repository_dispatch:
    types: [scan]          # lets an outside timer (for example cron-job.org) trigger a scan
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't write files)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: scan-giveaways
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gate (skip if scanned recently)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime, os
          run = "true"
          if os.environ.get("EVENT") == "schedule":
              try:
                  t = json.load(open("data/status.json"))["updated_at"]
                  age = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(t.replace("Z", "+00:00"))).total_seconds()
                  if age < 1800:
                      run = "false"
              except Exception:
                  pass
          print("run=" + run)
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Run scanner
        if: steps.gate.outputs.run == 'true'
        run: python scripts/scan.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MOJEEK_API_KEY: ${{ secrets.MOJEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MARGINALIA_API_KEY: ${{ secrets.MARGINALIA_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAGI_API_TOKEN: ${{ secrets.KAGI_API_TOKEN }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit changes
        if: ${{ steps.gate.outputs.run == 'true' && !inputs.dry_run }}
        run: |
          git config user.name "giveaway-bot"
          git config user.email "giveaway-bot@users.noreply.github.com"
          git add data feed.xml
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "chore: scan $(date -u +%FT%TZ)" && git pull --rebase && git push; fi
